id: F5-V3
family: F5
current_version: v1.140.1
target_version: v2.0.0
expected_label: ADVISORY
evidence: [E22, E08, E21]
evidence_strength: medium
evidence_note: "Assumes the explicit pgvecto.rs setting keeps the DB on pgvecto.rs so the v2.0.0 warning fires; the warning condition is read from code, not observed."
rationale: >
  The image already ships VectorChord, but DB_VECTOR_EXTENSION=pgvecto.rs is set. The upgrading docs
  info box exempts only setups that have NOT set DB_VECTOR_EXTENSION explicitly, so this setup is
  not exempt. In v2.0.0 the value is still accepted (E21), and the server warns that pgvecto.rs is
  deprecated and support "will be removed very soon" (E22). It is recommended, not mandatory, for
  this target. This case shows the ownership rule: the same config scored under F6 for a <3.0
  target is NOT_APPLICABLE (compare F6-N2), because the deprecation advisory is owned by F5.
expected_actions:
  - "Recommended before v3: back up, then remove DB_VECTOR_EXTENSION (auto-detect) or set it to vectorchord"
missing_inputs: []
# Full-report answer key (Phase 1.1, findings added in 1.2): all six families, every finding with its rule,
# label, services and UNKNOWN reason, every certain action key and the upgrade path. Authored from the
# sources, then diffed against the engine (0 diffs). Evidence/remediation per rule: test/golden/rules.yaml.
expected_report:
  families:
    F1: NOT_APPLICABLE
    F2: NOT_APPLICABLE
    F3: NOT_APPLICABLE
    F4: NOT_APPLICABLE
    F5: ADVISORY
    F6: NOT_APPLICABLE
  action_keys:
    - db.migrate-to-vectorchord
  upgrade_path:
    status: NO_KNOWN_STOP
    stops: []
    advisory_stops: []
    open_risks: []
  missing_tokens: []
  unknown_rules: []
  config_details: []
  findings:
    - rule: F5-2x-explicit-pgvectors
      label: ADVISORY
      services:
        - database
        - immich-server
files:
  docker-compose.yml: |
    name: immich
    services:
      immich-server:
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        volumes:
          - ${UPLOAD_LOCATION}:/usr/src/app/upload
        env_file: [.env]
        ports: ['2283:2283']
      database:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        environment:
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_USER: ${DB_USERNAME}
          POSTGRES_DB: ${DB_DATABASE_NAME}
        volumes:
          - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
  .env: |
    # SYNTHETIC - not a real deployment
    UPLOAD_LOCATION=./library
    DB_DATA_LOCATION=./postgres
    IMMICH_VERSION=v1.140.1
    DB_PASSWORD=synthetic-placeholder
    DB_USERNAME=postgres
    DB_DATABASE_NAME=immich
    DB_VECTOR_EXTENSION=pgvecto.rs
