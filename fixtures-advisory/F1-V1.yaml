id: F1-V1
family: F1
current_version: v2.6.3
target_version: v2.7.5
expected_label: ADVISORY
evidence: [E23, E11]
evidence_strength: strong
rationale: >
  MACHINE_LEARNING_PRELOAD__CLIP still works in v2.7.5 (a fallback translates it), so no action is
  mandatory for this target. The ML service at tag v2.7.5 logs an explicit official recommendation:
  "Deprecated env variable: 'MACHINE_LEARNING_PRELOAD__CLIP'. Use ... __TEXTUAL and ... __VISUAL
  instead", and v3.0.0 removes the fallback. That makes it recommended but not yet mandatory.
expected_actions:
  - "Recommended before v3: replace MACHINE_LEARNING_PRELOAD__CLIP with MACHINE_LEARNING_PRELOAD__CLIP__TEXTUAL and MACHINE_LEARNING_PRELOAD__CLIP__VISUAL"
missing_inputs: []
