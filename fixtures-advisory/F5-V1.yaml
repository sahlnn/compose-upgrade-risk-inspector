id: F5-V1
family: F5
current_version: v1.132.3
target_version: v1.133.0
expected_label: ADVISORY
evidence: [E04]
evidence_strength: strong
rationale: >
  v1.133.0 lists the VectorChord image switch under BREAKING CHANGES, but its own FAQ says that with
  the old image "Immich will auto-detect the vector extension available in the DB and continue to
  work without manual intervention. However, we will drop support for pgvecto.rs in a later release,
  so please switch at your convenience." So the switch is explicitly recommended, not mandatory.
  Trap: the BREAKING heading must not turn this into ACTION_REQUIRED.
expected_actions:
  - "Recommended: back up, then switch to ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0 (tag from the v1.133.0 note) and remove the legacy command/healthcheck blocks"
missing_inputs: []
# Full-report answer key (Phase 1.1, findings added in 1.2): all six families, every finding with its rule,
# label, services and UNKNOWN reason, every certain action key and the upgrade path. Authored from the
# sources, then diffed against the engine (0 diffs). Evidence/remediation per rule: test/golden/rules.yaml.
expected_report:
  families:
    F1: NOT_APPLICABLE
    F2: NOT_APPLICABLE
    F3: NOT_APPLICABLE
    F4: NOT_APPLICABLE
    F5: ADVISORY
    F6: NOT_APPLICABLE
  action_keys:
    - db.migrate-to-vectorchord
  upgrade_path:
    status: NO_KNOWN_STOP
    stops: []
    advisory_stops: []
    open_risks: []
  missing_tokens: []
  unknown_rules: []
  config_details: []
  findings:
    - rule: F5-2x-switch-image
      label: ADVISORY
      services:
        - database
files:
  docker-compose.yml: |
    name: immich
    services:
      immich-server:
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        volumes:
          - ${UPLOAD_LOCATION}:/usr/src/app/upload
        env_file: [.env]
        ports: ['2283:2283']
      database:
        container_name: immich_postgres
        image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
        environment:
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_USER: ${DB_USERNAME}
          POSTGRES_DB: ${DB_DATABASE_NAME}
        volumes:
          - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
        command: >-
          postgres
          -c shared_preload_libraries=vectors.so
          -c 'search_path="$$user", public, vectors'
  .env: |
    # SYNTHETIC - not a real deployment
    UPLOAD_LOCATION=./library
    DB_DATA_LOCATION=./postgres
    IMMICH_VERSION=v1.132.3
    DB_PASSWORD=synthetic-placeholder
    DB_USERNAME=postgres
    DB_DATABASE_NAME=immich
