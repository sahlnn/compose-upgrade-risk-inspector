id: F5-A1
family: F5
current_version: v1.132.3
target_version: v3.0.0
expected_label: ACTION_REQUIRED
evidence: [E10, E12, E08, E21]
evidence_strength: strong
rationale: >
  The bundled DB uses the old tensorchord/pgvecto-rs image, which has no VectorChord or pgvector.
  v3.0.0 dropped pgvecto.rs. Per PR #28159 the server "will refuse to start if no supported
  extension is installed". The upgrading docs give the replacement image and say to drop the old
  `command`/`healthcheck` overrides. The `-pgvectors` image variant is needed because pgvecto.rs
  must be present during the one-time migration.
expected_actions:
  - "Back up the database"
  - "Change the image to ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0 (pg14 + pgvecto.rs 0.2.0 match)"
  - "Remove the old healthcheck and `command` (shared_preload_libraries=vectors.so) blocks, as in the documented diff"
  - "Add shm_size: 128mb (present in the current documented diff; not stated as mandatory)"
  - "Do not downgrade below v1.133.0 afterwards"
missing_inputs: []
# Full-report answer key (Phase 1.1, findings added in 1.2): all six families, every finding with its rule,
# label, services and UNKNOWN reason, every certain action key and the upgrade path. Authored from the
# sources, then diffed against the engine (0 diffs). Evidence/remediation per rule: test/golden/rules.yaml.
expected_report:
  families:
    F1: NOT_APPLICABLE
    F2: NOT_APPLICABLE
    F3: NOT_APPLICABLE
    F4: NOT_APPLICABLE
    F5: ACTION_REQUIRED
    F6: NOT_APPLICABLE
  action_keys:
    - db.image.replace-with-vectorchord
  upgrade_path:
    status: NO_KNOWN_STOP
    stops: []
    advisory_stops: []
    open_risks: []
  missing_tokens: []
  unknown_rules: []
  config_details:
    - PostgreSQL 14
    - pgvecto.rs 0.2.0
  findings:
    - rule: F5-300-no-supported-extension
      label: ACTION_REQUIRED
      services:
        - database
files:
  docker-compose.yml: |
    name: immich
    services:
      immich-server:
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        volumes:
          - ${UPLOAD_LOCATION}:/usr/src/app/upload
        env_file: [.env]
        ports: ['2283:2283']
      database:
        container_name: immich_postgres
        image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
        environment:
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_USER: ${DB_USERNAME}
          POSTGRES_DB: ${DB_DATABASE_NAME}
          POSTGRES_INITDB_ARGS: '--data-checksums'
        volumes:
          - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
        healthcheck:
          test: pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1
          interval: 5m
        command: >-
          postgres
          -c shared_preload_libraries=vectors.so
          -c 'search_path="$$user", public, vectors'
          -c logging_collector=on
        restart: always
  .env: |
    # SYNTHETIC - not a real deployment
    UPLOAD_LOCATION=./library
    DB_DATA_LOCATION=./postgres
    IMMICH_VERSION=v1.132.3
    DB_PASSWORD=synthetic-placeholder
    DB_USERNAME=postgres
    DB_DATABASE_NAME=immich
