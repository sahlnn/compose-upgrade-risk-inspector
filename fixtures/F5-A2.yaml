id: F5-A2
family: F5
current_version: v2.7.5
target_version: v3.0.0
expected_label: ACTION_REQUIRED
evidence: [E10, E12, E08]
evidence_strength: strong
rationale: >
  The image is non-default: pg16 + pgvecto.rs v0.3.0. The upgrading docs say to match the pg major
  version and the pgvecto.rs version, and give this exact example: pg16-v0.3.0 ->
  ghcr.io/immich-app/postgres:16-vectorchord0.3.0-pgvectors0.3.0. Copying the default pg14 image
  from the diff would be wrong. (Why it fails, i.e. that a pg14 server cannot open a pg16 data
  directory, is general PostgreSQL behaviour and not an Immich source.)
  Note: the doc example says vectorchord0.3.0 while the default image now uses vectorchord0.4.3.
  The expected action quotes the documented example and flags the version as unverified.
expected_actions:
  - "Back up the database"
  - "Change the image to ghcr.io/immich-app/postgres:16-vectorchord<X>-pgvectors0.3.0 (doc example: vectorchord0.3.0; the latest valid X is unverified)"
missing_inputs: []
# Full-report answer key (Phase 1.1, findings added in 1.2): all six families, every finding with its rule,
# label, services and UNKNOWN reason, every certain action key and the upgrade path. Authored from the
# sources, then diffed against the engine (0 diffs). Evidence/remediation per rule: test/golden/rules.yaml.
expected_report:
  families:
    F1: NOT_APPLICABLE
    F2: NOT_APPLICABLE
    F3: NOT_APPLICABLE
    F4: NOT_APPLICABLE
    F5: ACTION_REQUIRED
    F6: NOT_APPLICABLE
  action_keys:
    - db.image.replace-with-vectorchord
  upgrade_path:
    status: NO_KNOWN_STOP
    stops: []
    advisory_stops: []
    open_risks: []
  missing_tokens: []
  unknown_rules: []
  config_details:
    - PostgreSQL 16
    - pgvecto.rs 0.3.0
  findings:
    - rule: F5-300-no-supported-extension
      label: ACTION_REQUIRED
      services:
        - database
files:
  docker-compose.yml: |
    name: immich
    services:
      immich-server:
        image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
        volumes:
          - ${UPLOAD_LOCATION}:/data
        env_file: [.env]
        ports: ['2283:2283']
      database:
        container_name: immich_postgres
        image: docker.io/tensorchord/pgvecto-rs:pg16-v0.3.0
        environment:
          POSTGRES_PASSWORD: ${DB_PASSWORD}
          POSTGRES_USER: ${DB_USERNAME}
          POSTGRES_DB: ${DB_DATABASE_NAME}
        volumes:
          - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
        restart: always
  .env: |
    # SYNTHETIC - not a real deployment
    UPLOAD_LOCATION=./library
    DB_DATA_LOCATION=./postgres
    IMMICH_VERSION=v2.7.5
    DB_PASSWORD=synthetic-placeholder
    DB_USERNAME=postgres
    DB_DATABASE_NAME=immich
