id: F1-A1
family: F1
current_version: v1.118.2
target_version: v1.119.0
expected_label: ACTION_REQUIRED
evidence: [E03]
evidence_strength: strong
rationale: >
  v1.119.0 removed IMMICH_METRICS and IMMICH_HOST_METRICS (and the other *_METRICS vars).
  This .env sets both, so the user relies on the Prometheus endpoint. The release note
  gives this exact replacement: IMMICH_TELEMETRY_INCLUDE=all + IMMICH_TELEMETRY_EXCLUDE=host.
expected_actions:
  - "Replace IMMICH_METRICS=true / IMMICH_HOST_METRICS=false with IMMICH_TELEMETRY_INCLUDE=all and IMMICH_TELEMETRY_EXCLUDE=host"
missing_inputs: []
