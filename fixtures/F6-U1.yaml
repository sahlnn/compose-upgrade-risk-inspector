id: F6-U1
family: F6
current_version: v2.7.5
target_version: v3.0.0
expected_label: UNKNOWN
evidence: [E04, E08]
evidence_strength: weak
evidence_note: "No official statement on a legacy command override with the VectorChord image; risk is inferred."
rationale: >
  The image was switched to the VectorChord image, but the pre-1.133 `command` override is still
  there (shared_preload_libraries=vectors.so, search_path with vectors). The official diff removes
  these lines and says the settings "are now incorporated into the image itself", but no
  official source says what happens if they are kept. This override may stop the image's own
  preload settings (VectorChord) from applying. That is plausible but unverified, so the result
  is UNKNOWN, not NOT_APPLICABLE.
expected_actions: ["Recommend removing the legacy `command` block per the upgrading docs; flag as unverified risk"]
missing_inputs: ["official statement on legacy command override with the VectorChord image"]
