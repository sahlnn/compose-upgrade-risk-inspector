id: F6-A1
family: F6
current_version: v2.7.5
target_version: v3.0.0
expected_label: ACTION_REQUIRED
evidence: [E11, E12, E21]
evidence_strength: strong
rationale: >
  DB_VECTOR_EXTENSION=pgvecto.rs is set explicitly. In v3.0.0 the env schema only accepts
  'pgvector' | 'vectorchord' (server/src/dtos/env.dto.ts at tag v3.0.0), and the v3 migration blog
  says using it "now throws an error". The DB image already ships VectorChord, so the only fix
  is the env var. Trap: the image looks modern, but the explicit override keeps the server on
  pgvecto.rs.
expected_actions:
  - "Remove DB_VECTOR_EXTENSION (auto-detect) or set it to vectorchord; back up first, as the server migrates on startup"
missing_inputs: []
