id: F5-U2
family: F5
current_version: v2.7.5
target_version: v3.0.0
expected_label: UNKNOWN
evidence: [E10, E12]
evidence_strength: strong
rationale: >
  The bundled DB uses a private, re-tagged image (registry.example.internal/platform/postgres-immich:stable).
  Its name says nothing about which vector extensions it contains, and DB_VECTOR_EXTENSION is not
  set. A tool must not guess from the word "immich" in the tag.
expected_actions: ["Identify the base image / installed extensions of the custom image"]
missing_inputs: ["custom image contents"]
