current_version: v2.7.5
target_version: v3.0.0
expected_label: NOT_APPLICABLE
evidence: [E09, E12, E21]
evidence_strength: medium
evidence_note: "pgvector support in v3 is from code and env docs; general pgvector-image compatibility is not verified."
rationale: >
  The deployment uses pgvector, not pgvecto.rs. v3.0.0 removed only pgvecto.rs: the v3.0.0 env
  schema still accepts DB_VECTOR_EXTENSION=pgvector (code at tag v3.0.0), and the env docs list
  [vectorchord, pgvector]. The upgrading FAQ presents VectorChord as faster, but no deprecation or
  removal of pgvector is announced, so this is not ADVISORY under the dataset definition.
  Trap: "not on VectorChord" does not mean "must migrate".
  Scope: this label covers F5 only; general pgvector-image compatibility with v3 is not covered.
