id: F6-N2
family: F6
current_version: v2.6.3
target_version: v2.7.5
expected_label: NOT_APPLICABLE
evidence: [E12, E21]
evidence_strength: medium
evidence_note: "Correct only if the pgvecto.rs deprecation advisory is owned by F5, not F6 (project design decision: pgvecto.rs deprecation advisories belong to F5, its removal to F6)."
rationale: >
  pgvecto.rs is deprecated but still supported in 2.x: at tag v2.7.5, env.dto.ts accepts
  'pgvector' | 'pgvecto.rs' | 'vectorchord'. Removal starts at v3.0.0, which this range does not
  reach. Trap: "deprecated" is not the same as "removed" for this target. A tool may add an
  informational note about the coming removal, but the label is NOT_APPLICABLE.
