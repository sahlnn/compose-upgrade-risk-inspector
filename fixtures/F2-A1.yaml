id: F2-A1
family: F2
current_version: v1.117.0
target_version: v1.118.2
expected_label: ACTION_REQUIRED
evidence: [E02, E01]
evidence_strength: strong
rationale: >
  v1.118.0 removed the `start.sh immich` and `start.sh microservices` commands and aligned the
  server's internal port to 2283. This compose still has the immich-microservices service,
  both start.sh commands, and the '2283:3001' mapping, so all three documented edits apply.
expected_actions:
  - "Remove `command: ['start.sh', 'immich']` from immich-server"
  - "Remove the entire immich-microservices service, then run `docker compose down --remove-orphans`"
  - "Change ports '2283:3001' to '2283:2283' (reverse proxies on 3001 must move to 2283)"
missing_inputs: []
