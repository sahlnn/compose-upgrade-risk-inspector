  families:
    F1: NOT_APPLICABLE
    F2: ACTION_REQUIRED
    F3: NOT_APPLICABLE
    F4: NOT_APPLICABLE
    F5: NOT_APPLICABLE
    F6: NOT_APPLICABLE
  action_keys:
    - compose.ports:immich-server-2283
    - compose.remove:immich-microservices
    - compose.remove:start.sh-command
  upgrade_path:
    status: NO_KNOWN_STOP
    stops: []
    advisory_stops: []
    open_risks: []
  missing_tokens: []
  unknown_rules: []
