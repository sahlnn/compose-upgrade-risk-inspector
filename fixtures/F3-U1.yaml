rationale: >
  The server image uses the floating `release` tag and IMMICH_VERSION is not set, so the running
  version cannot be found from config. It may be below 1.107.2. The tag says what will be pulled
  next, not what is running now.
expected_actions: ["Read the running version (web UI / server about endpoint) and re-run with --current"]
